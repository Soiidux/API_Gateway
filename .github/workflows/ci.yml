name: CI

# Runs on every push and PR, plus manual dispatch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch — saves CI minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build + test each package independently.
  #
  # There is no root package.json (each package installs on its own), so this is
  # a matrix rather than a single job. No services are needed: the unit tests
  # inject fake DB/RabbitMQ collaborators through the handlers' dependency
  # seams, and tsconfig only compiles src/**/* — drizzle.config.ts reads
  # DATABASE_URL but is never imported by a build or test.
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false # one broken package shouldn't hide the state of the others
      matrix:
        include:
          - package: gateway
            path: gateway
          - package: user-service
            path: services/user-service
          - package: payment-service
            path: services/payment-service
          - package: log-worker
            path: services/log-worker

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # ---------------------------------------------------------------------------
  # Prove every image still builds from a clean checkout — catches broken
  # Dockerfiles, which no amount of npm testing would.
  # ---------------------------------------------------------------------------
  docker:
    name: docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The multi-stage Dockerfiles build from node:20-alpine, so no Node
      # setup is needed here — the build happens inside the image.
      - name: Build images
        run: docker compose build

  # ---------------------------------------------------------------------------
  # Concurrency tests against REAL Postgres and Redis.
  #
  # These assert properties that belong to the datastore, not to this
  # TypeScript: that Postgres serialises the atomic upsert and the conditional
  # UPDATE (so concurrent withdrawals can't overdraw), and that Redis runs the
  # Lua token bucket without interleaving (so a burst can't exceed capacity).
  # A mock cannot demonstrate either — it returns whatever the test dictates —
  # so these need actual services. Kept in their own job so the fast unit suite
  # stays fast and a slow failure is easy to attribute.
  # ---------------------------------------------------------------------------
  concurrency:
    name: concurrency (real Postgres + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway_user
          POSTGRES_PASSWORD: gateway_secure_password
          POSTGRES_DB: gateway_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            gateway/package-lock.json
            services/payment-service/package-lock.json

      - name: Install gateway
        run: npm ci
        working-directory: gateway

      - name: Install payment-service
        run: npm ci
        working-directory: services/payment-service

      - name: Payment money paths under concurrent load
        run: npm run test:integration
        working-directory: services/payment-service
        env:
          DATABASE_URL: postgres://gateway_user:gateway_secure_password@localhost:5432/gateway_db

      - name: Rate limiter atomicity under concurrent load
        run: npm run test:integration
        working-directory: gateway
        env:
          REDIS_URL: redis://localhost:6379

  # ---------------------------------------------------------------------------
  # Smoke test: start the whole stack, wait for health, then prove the API
  # answers end to end (register -> login -> deposit -> 422 -> RBAC -> logs).
  #
  # `docker compose up --wait` blocks until every container with a healthcheck
  # reports healthy (Compose v2.17+), so the curl steps below can't race the
  # migrations. This job rebuilds because each job gets its own fresh runner —
  # images are not shared between jobs.
  # ---------------------------------------------------------------------------
  e2e:
    name: end-to-end smoke test
    runs-on: ubuntu-latest
    needs: [test, docker]

    steps:
      - uses: actions/checkout@v4

      - name: Build images (local daemon)
        run: docker compose build

      - name: Start the stack
        # --wait blocks until every healthcheck passes; the timeout is generous
        # because first boot runs migrations across six replicas.
        run: docker compose up -d --wait --wait-timeout 180

      # Prove the migrations actually landed and the services became healthy.
      # Without this, a stack that "starts" but never serves would still pass.
      - name: Wait for healthy services
        run: docker compose ps

      - name: Register, login, and deposit
        run: |
          set -euo pipefail

          # Port 3000 is the only published app port; everything else is
          # reachable only inside the compose network.
          BASE=http://localhost:3000

          echo "→ register"
          curl -fsS -X POST "$BASE/api/v1/users/register" \
            -H 'Content-Type: application/json' \
            -d '{"userId":"ci-user","email":"ci@example.com","password":"hunter2pass","role":"USER"}'

          echo; echo "→ login"
          TOKEN=$(curl -fsS -X POST "$BASE/api/v1/users/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"hunter2pass"}' \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>process.stdout.write(JSON.parse(d).data.token))')

          echo "got token (${#TOKEN} chars)"

          echo; echo "→ deposit"
          curl -fsS -X POST "$BASE/api/v1/payments/deposit" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"amount":100}'

          echo; echo "→ withdraw more than the balance (expect 422)"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/api/v1/payments/withdraw" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"amount":99999}')
          test "$STATUS" = "422" || { echo "expected 422, got $STATUS"; exit 1; }

          echo; echo "→ RBAC check (USER calling /getAll, expect 403)"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/v1/payments/getAll" \
            -H "Authorization: Bearer $TOKEN")
          test "$STATUS" = "403" || { echo "expected 403, got $STATUS"; exit 1; }

          # Token revocation. The whole point of the deny-list is that a token
          # the gateway still considers well-signed stops working after logout,
          # so this asserts on the SAME token before and after — not a fresh one.
          echo; echo "→ token works before logout"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/v1/payments/my" \
            -H "Authorization: Bearer $TOKEN")
          test "$STATUS" = "200" || { echo "expected 200, got $STATUS"; exit 1; }

          echo "→ logout"
          curl -fsS -X POST "$BASE/api/v1/users/logout" -H "Authorization: Bearer $TOKEN" >/dev/null

          echo "→ same token rejected after logout (expect 401)"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/v1/payments/my" \
            -H "Authorization: Bearer $TOKEN")
          test "$STATUS" = "401" || { echo "expected 401, got $STATUS"; exit 1; }

          echo; echo "→ confirming the log pipeline delivered rows to Postgres"
          LOG_COUNT=0
          for i in {1..30}; do
            LOG_COUNT=$(docker exec gateway_postgres psql -U gateway_user -d gateway_db -tAc \
              "SELECT count(*) FROM logs WHERE user_id = 'ci-user'" | tr -d '[:space:]')
            if [[ "$LOG_COUNT" =~ ^[1-9][0-9]*$ ]]; then
              break
            fi
            sleep 1
          done
          [[ "$LOG_COUNT" =~ ^[1-9][0-9]*$ ]] || { echo "no log rows for ci-user after waiting"; exit 1; }

          echo; echo "E2E OK"

      # Always dump logs — a failed smoke test is far easier to debug with the
      # container output in the job log.
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v