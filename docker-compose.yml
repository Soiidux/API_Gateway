services:
  postgres:
    image: postgres:16-alpine
    container_name: gateway_postgres
    environment:
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: gateway_secure_password
      POSTGRES_DB: gateway_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/datadocke
    networks:
      - gateway_net
    restart: always

  redis:
    image: redis:7-alpine
    container_name: gateway_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gateway_net
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gateway_rabbitmq
    ports:
      - "5672:5672"        # RabbitMQ AMQP messaging port
      - "15672:15672"      # RabbitMQ Management UI dashboard
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - gateway_net
    restart: always

networks:
  gateway_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: