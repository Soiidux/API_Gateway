# Describes every container as a "service". `docker-compose up --build`
# builds images and starts them all on one private network, where they
# find each other by SERVICE NAME as the hostname:
#
#   gateway    → rabbitmq:5672 (log-queue producer)
#   log-worker → rabbitmq:5672 + postgres:5432 (consumer → writer)
#
# URLs therefore use service names, NOT localhost — containers on the
# same network resolve each other by name; localhost inside a container
# is the container itself.
services:
  postgres:
    image: postgres:16-alpine
    container_name: gateway_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-gateway_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gateway_net
    restart: always
    # Liveness only: pg_isready succeeds as soon as the server accepts
    # connections, which can be BEFORE the first-boot database is actually
    # created. The services gate on their own /ready (post-migration), so this
    # check doesn't need to be stricter — it's here so dependent containers
    # don't race Postgres coming up at all.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway_user} -d ${POSTGRES_DB:-gateway_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: gateway_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gateway_net
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gateway_rabbitmq
    ports:
      - "5672:5672"        # RabbitMQ AMQP messaging port
      - "15672:15672"      # RabbitMQ Management UI dashboard
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - gateway_net
    restart: always
    # `rabbitmq-diagnostics` is the supported readiness probe and confirms the
    # node is actually accepting AMQP traffic (not merely that the process is
    # up, which is true well before the vhost is ready).
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway:
    build: ./gateway
    container_name: api_gateway_core
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-gateway_secret_is_super_secure}
      USER_SERVICE_URLS: http://user-service-1:3001,http://user-service-2:3001,http://user-service-3:3001
      PAYMENT_SERVICE_URLS: http://payment-service-1:3002,http://payment-service-2:3002,http://payment-service-3:3002
      REDIS_URL: redis://gateway_redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
    ports:
      - "3000:3000"
    networks:
      - gateway_net
    # service_healthy (not the short-list form) so the gateway only starts once
    # Postgres/Redis/RabbitMQ are genuinely accepting traffic — the short form
    # only waits for containers to *start*.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  log-worker:
    # The CONSUMER: pulls messages off the "api_gateway_logs" queue and
    # batch-inserts them into postgres's gateway_db.logs table.
    # depends_on just waits for postgres/rabbitmq CONTAINERS to start —
    # our code is what actually waits (migrations before consuming, and
    # the connect-retry loop in LogConsumer).
    build: ./services/log-worker
    container_name: log_worker
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      DATABASE_URL: postgres://${POSTGRES_USER:-gateway_user}:${POSTGRES_PASSWORD:-gateway_secure_password}@postgres:5432/${POSTGRES_DB:-gateway_db}
    networks:
      - gateway_net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  user-service-1:
    build: ./services/user-service
    container_name: user_replica_1
    environment:
      PORT: 3001
      INSTANCE_ID: 1
      JWT_SECRET: ${JWT_SECRET:-gateway_secret_is_super_secure}
      DATABASE_URL: postgres://${POSTGRES_USER:-gateway_user}:${POSTGRES_PASSWORD:-gateway_secure_password}@postgres:5432/${POSTGRES_DB:-gateway_db}
    networks:
      - gateway_net
    depends_on:
      postgres:
        condition: service_healthy

  user-service-2:
    build: ./services/user-service
    container_name: user_replica_2
    environment:
      PORT: 3001
      INSTANCE_ID: 2
      JWT_SECRET: ${JWT_SECRET:-gateway_secret_is_super_secure}
      DATABASE_URL: postgres://${POSTGRES_USER:-gateway_user}:${POSTGRES_PASSWORD:-gateway_secure_password}@postgres:5432/${POSTGRES_DB:-gateway_db}
    networks:
      - gateway_net
    depends_on:
      postgres:
        condition: service_healthy

  user-service-3:
    build: ./services/user-service
    container_name: user_replica_3
    environment:
      PORT: 3001
      INSTANCE_ID: 3
      JWT_SECRET: ${JWT_SECRET:-gateway_secret_is_super_secure}
      DATABASE_URL: postgres://${POSTGRES_USER:-gateway_user}:${POSTGRES_PASSWORD:-gateway_secure_password}@postgres:5432/${POSTGRES_DB:-gateway_db}
    networks:
      - gateway_net
    depends_on:
      postgres:
        condition: service_healthy


  payment-service-1:
    build: ./services/payment-service
    container_name: payment_replica_1
    environment:
      PORT: 3002
      INSTANCE_ID: 1
      JWT_SECRET: ${JWT_SECRET:-gateway_secret_is_super_secure}
      DATABASE_URL: postgres://${POSTGRES_USER:-gateway_user}:${POSTGRES_PASSWORD:-gateway_secure_password}@postgres:5432/${POSTGRES_DB:-gateway_db}
    networks:
      - gateway_net
    depends_on:
      postgres:
        condition: service_healthy

  payment-service-2:
    build: ./services/payment-service
    container_name: payment_replica_2
    environment:
      PORT: 3002
      INSTANCE_ID: 2
      JWT_SECRET: ${JWT_SECRET:-gateway_secret_is_super_secure}
      DATABASE_URL: postgres://${POSTGRES_USER:-gateway_user}:${POSTGRES_PASSWORD:-gateway_secure_password}@postgres:5432/${POSTGRES_DB:-gateway_db}
    networks:
      - gateway_net
    depends_on:
      postgres:
        condition: service_healthy

  payment-service-3:
    build: ./services/payment-service
    container_name: payment_replica_3
    environment:
      PORT: 3002
      INSTANCE_ID: 3
      JWT_SECRET: ${JWT_SECRET:-gateway_secret_is_super_secure}
      DATABASE_URL: postgres://${POSTGRES_USER:-gateway_user}:${POSTGRES_PASSWORD:-gateway_secure_password}@postgres:5432/${POSTGRES_DB:-gateway_db}
    networks:
      - gateway_net
    depends_on:
      postgres:
        condition: service_healthy
  

networks:
  gateway_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: